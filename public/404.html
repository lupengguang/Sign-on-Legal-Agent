<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>签安 SignSafe</title>
    <script>
      // GitHub Pages SPA 回退：把 404 路径转为 hash 路由
      ;(function () {
        var base = '/Sign-on-Legal-Agent'
        var path = location.pathname.startsWith(base)
          ? location.pathname.slice(base.length)
          : location.pathname
        location.replace(base + '/#' + (path || '/') + location.search)
      })()
    </script>
  </head>
  <body></body>
</html>
